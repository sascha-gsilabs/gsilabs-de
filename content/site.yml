      - { label: For Precast Manufacturers, href: /solutions/precast-manufacturers }
      - { label: For Product Manufacturers, href: /solutions/product-manufacturers }
      - { label: For Real Estate Developers, href: /solutions/real-estate-developers }
  - id: company
    label: Company
    items:
      - { label: About, href: /about }
      - { label: Our Process, href: /our-process }
      - { label: Careers, href: /careers }
      - { label: Imprint, href: /imprint }
      - { label: Privacy, href: /privacy }
  - id: services
    label: Services
    items:
      - { label: AI Advisory, href: /services/ai-advisory }
      - { label: AI Sovereign Infrastructure, href: /services/ai-sovereign-infrastructure }
      - { label: Geotechnical Engineering Software, href: /services/geotechnical-engineering-software }
      - { label: Design Automation, href: /services/design-automation }
      - { label: BIM Software Development, href: /services/bim-software-development }
      - { label: BIM Content Development, href: /services/bim-content-development }
  - id: insights
    label: Insights
    items:
      - { label: Projects, href: /insights/projects }
      - { label: Articles, href: /insights/articles }
      - { label: All Insights, href: /insights }

social:
  - { label: LinkedIn, href: "https://www.linkedin.com/company/gsi-software-gmbh", icon: linkedin }
  - { label: YouTube, href: "https://www.youtube.com/@GSI-Software-Germany", icon: youtube }

outboundNote:
  label: Explore more geotechnical solutions on piledesigner.io
  href: "https://piledesigner.io/"
