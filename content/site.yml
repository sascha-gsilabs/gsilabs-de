# Site wide content. Every page's header, footer and metadata comes from here,
# so navigation only ever needs editing in one place.
#
# This is the English site, and it is the canonical one. The German site is a
# thin overlay at content/de/site.yml: it lists only the keys whose value
# differs, and the build merges it over this file. Anything not listed there,
# the phone number, the HubSpot ids, the social links, is inherited, so it
# cannot drift between the two languages.

company:
  name: GSI Labs
  legalName: GSI Software GmbH
  street: Rudi-Dutschke-Str. 23
  postcode: "10969"
  city: Berlin
  country: Germany
  email: info@gsilabs.de
  phone: "+49 30 75431568"
  phoneHref: "+493075431568"
  legalLine: >-
    GSI Software GmbH. Registered in Berlin, Germany (HRB 193812 B).
    Managing Director: Sascha Avermiddig. VAT ID: DE316566578.
    Contact: info@gsilabs.de

seo:
  titleSuffix: GSI Labs
  siteName: GSI Labs
  defaultDescription: >-
    GSI Labs builds AI solutions for the AEC industry. We automate workflows for
    contractors, engineers, manufacturers, and developers across Europe.
  origin: https://www.gsilabs.de
  socialImage: /assets/img/social-preview.jpg
  # og:locale. Not the same string as the hreflang code, which is `languages[].code`.
  ogLocale: en_GB
  # Feeds the Organization record in the page head, which is how search engines
  # learn the company behind the site is one entity across both languages.
  description: >-
    GSI Labs is the AI and software partner for the built environment. We build
    automation, engineering software and AI systems for construction companies,
    design offices, manufacturers and developers across Europe.

# Interface text the templates emit themselves, as opposed to text that comes out
# of a content file. Every string a visitor can read has to live in one of those
# two places, or the German site would quietly keep an English word in it.
ui:
  skipToContent: Skip to content
  mainNav: Main
  menu: Menu
  close: Close
  home: home
  email: Email
  phone: Phone
  language: Language
  languageSelected: selected
  socialOn: on
  articles: Articles
  projects: Projects
  latestNews: Latest News
  allInsights: All insights
  keepReading: Keep reading
  readMore: Read more
  careers: Careers
  role: Role
  employment: Employment
  location: Location
  applyNow: Apply now
  seeAllRoles: See all roles
  applicationSubject: "Application"
  applyNoscript: >-
    The form needs JavaScript. Send your CV and a short note about what you want to
    work on to {email} instead.
  formNoscript: >-
    The form needs JavaScript. Write to {email} instead and you reach the same people.
  # The first layer names neither the company nor the country. It says what
  # happens, offers the two answers, and points at the detail. Who receives what,
  # and where, is one click away in the panel and spelled out in the privacy
  # policy. That split holds here because the transfer rests on the standard
  # contractual clauses rather than on the visitor's consent: had it rested on
  # Art. 49(1)(a), the warning about US authorities would belong in the consent
  # itself and so on this layer. tools/test-consent.mjs guards the line.
  consentTitle: Your privacy
  consentBody: >-
    This website stores information on your device. Some of it is needed for the
    pages to work. The rest runs only if you agree. You choose what to allow, and
    you can change your mind at any time.
  consentAcceptAll: Accept all
  consentRejectAll: Reject all
  consentCustomise: Choose
  consentPanelTitle: What you allow
  consentSave: Save choice
  consentAlwaysOn: Always on
  consentMore: Privacy policy
  # Not "cookie settings". There are no cookies to settle: nothing on this site
  # writes one, which was measured rather than assumed. A label naming something
  # the site does not do is the wrong place to start a privacy notice.
  consentSettings: Tracking settings

  # One entry per switch in the panel. The vendor belongs here rather than on the
  # first layer, close enough to the switch that turning it on is a decision about
  # a named company and not about a word like "marketing".
  consentNecessary: Necessary
  consentNecessaryBody: >-
    Delivers the pages and remembers the choice you make here. No third party is
    involved and none of it identifies you.
  consentMarketing: Marketing
  consentMarketingBody: >-
    Apollo.io, a service of ZenLeads Inc. in the United States, receives your IP
    address and the pages you open, and matches the address against its own database
    of company networks. It tells us which companies read our work, not which people.
    It sets no cookies, but it stores an identifier in your browser.
  consentAnalytics: Analytics
  consentAnalyticsBody: >-
    Google Analytics counts which pages are read and how visitors find us. It sets
    cookies that last up to two years and shortens your IP address before storing it.
    We have switched off Google's advertising features.

# The consent banner, and what waits behind each of its switches. A group with no
# service configured is not offered, and with nothing optional left the banner is
# not rendered at all: there would be nothing to ask about. Adding a measurement id
# to the analytics group below is all it takes to bring Google back.
consent:
  # Named `href` so the build puts the language prefix in front of it, the same way
  # it does for every other link in the header and footer.
  href: /privacy
  groups:
    - id: necessary
      required: true
    - id: marketing
      apollo: "6a3a8cdc1229b300147d5bc7"
    - id: analytics
      ga4: ""

# The HubSpot forms the site embeds, named for the job they do rather than by
# their id, so a page asks for `enquiry` and never carries a UUID. Region and
# portal belong to the account and are the same for every form: only the id under
# `forms` changes. Replacing a form means pasting its new id here, once.
hubspot:
  region: eu1
  portalId: "146150011"
  forms:
    enquiry: 16241ff4-56ee-42ce-a5b7-9967520290c5
    application: 13146800-d8a8-4ccd-9c2e-f409489abeaf

cta:
  label: Get Started
  href: /get-started

# The languages the site is published in, in the order the switcher offers them.
# The first entry is the one served from the root; every later entry gets its
# `prefix` in front of each route. Which entry is current, and where the switcher
# points, is worked out per page by the build, so nothing here has to be edited
# when a page is added.
languages:
  - { code: en, label: English, short: EN, prefix: "", dateLocale: en-US, dir: content }
  - { code: de, label: Deutsch, short: DE, prefix: /de, dateLocale: de-DE, dir: content/de }

# The header menus. The footer reuses these groups, plus the legal links.
